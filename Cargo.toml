[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/backend",
    "crates/frontend",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Skeleton Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
common = { path = "crates/common" }

# Async runtime & Web
tokio = { version = "1.43", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Serialization & Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde", "js"] }
thiserror = "2.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }
